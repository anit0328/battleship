<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レーダー作戦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one portrait "radar console" column — status bar on top, the active view in the middle, a 2-tab dock at the bottom; the battle overlay stacks the enemy area over your own. */
:root{
  --ink:#0C1F27;          /* device body / page ground */
  --panel:#13303B;        /* raised panels */
  --line:#24505E;         /* dot-matrix grid & hairlines */
  --paper:#F4F1E8;        /* card stock */
  --paper-ink:#1D1A33;    /* text on paper */
  --coral:#FF7A59;        /* primary action */
  --gold:#FFC83D;         /* QR coin */
  --mint:#5ED6B0;         /* good / you */
  --rose:#FF5C7A;         /* bad / opponent */
  --muted:#8FB2BC;
  --display:"DotGothic16","M PLUS Rounded 1c",ui-monospace,monospace;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:500;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:14px 14px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(12,31,39,.6),rgba(12,31,39,.95));box-shadow:0 0 0 1px var(--line)}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.namechip{display:flex;flex-direction:column;align-items:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 12px;min-width:0;max-width:52%}
.namechip small{font-size:10px;color:var(--muted);letter-spacing:.08em}.namechip small span{color:var(--gold);font-weight:800}
.namechip b{font:800 15px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.namechip b::after{content:' ✎';font-size:11px;color:var(--muted)}
.coin{display:flex;align-items:center;gap:6px;background:#0A1A20;border:2px solid var(--gold);border-radius:99px;padding:4px 10px 4px 5px;min-width:0}.coin.gold{margin-left:auto}.coin.qp{border-color:var(--mint)}.coin.qp b{color:var(--mint)}.coin.qp i{background-color:var(--mint)}
.coin.gold.bump,.coin.qp.bump{animation:cbump .25s}@keyframes cbump{40%{transform:scale(1.12)}}
.gc{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF1B0,#FFC83D 55%,#C9900F);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);flex:none}
.coin i,.ci{display:inline-block;width:20px;height:20px;border-radius:5px;background:var(--mint);position:relative;flex:none;
  background-image:linear-gradient(var(--paper-ink),var(--paper-ink)),linear-gradient(var(--paper-ink),var(--paper-ink)),linear-gradient(var(--paper-ink),var(--paper-ink));
  background-size:6px 6px;background-position:3px 3px,11px 3px,3px 11px;background-repeat:no-repeat}
.coin b{font:400 16px var(--display);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.namechip{max-width:36%}
.gear{width:38px;height:38px;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:18px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.dock{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#0A1A20;padding-bottom:env(safe-area-inset-bottom,0px)}
.dock button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:800 12px var(--body)}
.dock button canvas{width:28px;height:28px}
.dock button.on{color:var(--gold)}
.dock button.on canvas{filter:drop-shadow(0 0 6px rgba(255,200,61,.6))}
h2{margin:0;font:400 22px var(--display);letter-spacing:.04em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.btn{border:0;border-radius:14px;padding:12px 18px;font:800 16px var(--body);background:var(--coral);color:var(--paper-ink);box-shadow:0 4px 0 #A8402A;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A8402A}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #B68714}
.btn.ghost{background:var(--panel);color:var(--paper);box-shadow:0 4px 0 #071318;border:2px solid var(--line)}
.btn small{display:block;font-size:11px;font-weight:800;opacity:.8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px}
.toast.btm{font:400 18px var(--display);padding:10px 18px;border:3px solid var(--paper-ink)}.toast.btm.w{background:#DDF7EC;color:#146B45}.toast.btm.l{background:#FFE1E6;color:#A3243B}.toast.btm.d{background:#ECE8DD}.toast.btm.vd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 22px}.toast.btm.vd b{font:400 30px/1.1 var(--display);letter-spacing:.06em}.toast.btm.vd small{font:800 14px var(--body)}.toast.btm.vd em{font:400 22px var(--display);font-style:normal;padding:0 2px}
.card.win{filter:drop-shadow(0 0 10px #FFC83D);transform:scale(1.12);transition:transform .2s}.card.lose{opacity:.55;transform:scale(.92);transition:transform .2s,opacity .2s}
.toast.btm.vd.bet{background:linear-gradient(160deg,#FFE680,#FFC83D 45%,#E89A10);color:#4A2C00;border-color:#4A2C00;overflow:hidden;animation:betIn .45s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 0 0 3px rgba(255,200,61,.35),0 8px 24px rgba(0,0,0,.5)}
.toast.btm.vd.bet b{font-size:38px;letter-spacing:.12em;text-shadow:2px 2px 0 #FFF3B0,-1px -1px 0 #A86A00}.toast.btm.vd.bet small{display:flex;align-items:center;gap:5px}.toast.btm.vd.bet .ci{width:18px;height:18px}.toast.btm.vd.bet em{color:#1F6B3A}
.toast.btm.vd.bet::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:betShine .9s .3s ease-out both}
@keyframes betIn{0%{transform:translateX(-50%) scale(2.2) rotate(-8deg);opacity:0}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}@keyframes betShine{to{left:130%}}
.toast.btm.info{font:800 15px var(--body);background:#13303B;color:var(--paper);border-color:#3A6B7A}.toast.btm.bet{background:#FFF1C2;color:#7A5200}
#ovBattle .verdict{display:none}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:90;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:9px 16px;font:800 14px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap;animation:tin .25s both}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 10px;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip.net{cursor:pointer;color:var(--mint);border-color:var(--mint)}.chip.net.off{color:var(--muted);border-color:var(--line)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font:800 11px var(--body);color:var(--muted)}
/* overlays */
.ov{position:absolute;inset:0;z-index:50;background:rgba(5,14,18,.82);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:pop .3s both}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.sheet h3{margin:0;font:400 22px var(--display)}
.sheet .sub{color:#5E5A72}
.sheet input[type=text]{font:800 18px var(--body);padding:10px 12px;border-radius:12px;border:3px solid var(--paper-ink);background:#fff;color:var(--paper-ink);width:100%;box-sizing:border-box}
.sheet .cost{color:#1F8F5A}
.sheet .btn.ghost{background:#E6E1D3;color:var(--paper-ink);border-color:#CFC8B6;box-shadow:0 4px 0 #B9B2A0}
.mdet{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center}
.mdet canvas{width:140px;height:140px;background:radial-gradient(circle,#fff 30%,#E8E3D6 75%);border-radius:16px}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
.stat .bar{height:8px;border-radius:4px;background:#E2DCCD;overflow:hidden}.stat .bar i{display:block;height:100%;background:var(--coral)}
.stat b{font:400 13px var(--display);font-variant-numeric:tabular-nums}
.trait{background:#1D1A33;color:var(--paper);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.5}.trait b{color:var(--gold)}
.origin{font-size:11px;color:#6B6680;word-break:break-all}
.qrb{display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px;width:28px;height:28px;border-radius:8px;border:2px solid var(--paper-ink);background:#fff;padding:0;cursor:pointer;box-shadow:0 2px 0 #9C978A}.qrb .ci{width:18px;height:18px;border-radius:4px}.qrb:active{transform:translateY(2px);box-shadow:none}
.qrbig{display:grid;place-items:center}.qrbig canvas{width:min(78vw,280px);height:auto;image-rendering:pixelated;border-radius:8px;border:2px solid #E0D9C6}
/* match */
.match{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--paper);text-align:center}
.radar{width:160px;height:160px;border-radius:50%;border:2px solid var(--mint);position:relative;overflow:hidden;background:radial-gradient(circle,rgba(94,214,176,.15),transparent 70%)}
.radar::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(94,214,176,.55),transparent 30%);animation:spin 1.4s linear infinite;border-radius:50%}
.radar::after{content:'';position:absolute;inset:30%;border:1px solid var(--line);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.match b{font:400 20px var(--display)}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:100%}
.vsrow .t{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vsrow .t b{font:800 15px var(--body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsrow .mini{display:flex;gap:2px}.vsrow .mini canvas{width:44px;height:44px}
.vs{font:400 30px var(--display);color:var(--gold)}
.res h3{font-size:30px;text-align:center}
.res .cpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rules{font-size:12px;line-height:1.7;color:#4A4660}.rules b{color:var(--paper-ink)}
.rulecards{display:flex;gap:8px;justify-content:center;align-items:center;font:400 13px var(--display);color:var(--paper);text-align:center}
.qmark{width:32px;height:32px;border-radius:50%;border:3px solid var(--paper-ink);background:var(--paper);color:var(--paper-ink);font:900 17px var(--body);line-height:1;padding:0;cursor:pointer;flex:none;box-shadow:0 3px 0 #B9B2A0}
.qmark:active{transform:translateY(2px);box-shadow:0 1px 0 #B9B2A0}
.upbtn{display:flex;align-items:center;gap:10px;padding:10px 14px;white-space:nowrap}.upc{display:flex;align-items:center;gap:5px;font:800 15px var(--body);background:rgba(0,0,0,.12);border-radius:999px;padding:4px 10px 4px 5px}.upl{font-size:18px}
.sheet .rulecards{color:var(--paper-ink)}.sheet .kc{color:#B07A00}.sheet .kq{color:#1F8F5A}
.rulecards canvas{width:40px;height:40px}
.seg{display:flex;border:2px solid var(--paper-ink);border-radius:12px;overflow:hidden}.seg button{flex:1;border:0;background:#fff;padding:8px;font:800 13px var(--body);color:var(--paper-ink)}.seg button.on{background:var(--paper-ink);color:var(--paper)}
.volr{display:flex;align-items:center;gap:6px;margin-top:2px}.volr small{font-size:11px;color:#5E5A72;min-width:76px}.volr button{width:30px;height:30px;border-radius:50%;border:2px solid var(--paper-ink);background:#fff;color:var(--paper-ink);font:800 15px/1 var(--body);padding:0;flex:none;cursor:pointer;box-shadow:0 2px 0 #B9B2A0}.volr button:active{transform:translateY(2px);box-shadow:none}
.vm{flex:1;display:flex;gap:3px;align-items:flex-end;height:22px}.vm i{flex:1;background:#E0D9C6;border-radius:3px;cursor:pointer}.vm i:nth-child(1){height:30%}.vm i:nth-child(2){height:38%}.vm i:nth-child(3){height:46%}.vm i:nth-child(4){height:54%}.vm i:nth-child(5){height:62%}.vm i:nth-child(6){height:70%}.vm i:nth-child(7){height:78%}.vm i:nth-child(8){height:86%}.vm i:nth-child(9){height:93%}.vm i:nth-child(10){height:100%}.vm i.on{background:var(--coral)}.vn{font:800 12px var(--body);min-width:28px;text-align:right}
.opthd{position:sticky;top:-18px;z-index:2;margin:-18px -18px 0;padding:14px 14px 8px 18px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;border-radius:22px 22px 0 0}
.xbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--paper-ink);background:#fff;color:var(--paper-ink);font:800 17px/1 var(--body);padding:0;cursor:pointer;box-shadow:0 2px 0 #B9B2A0;flex:none}.xbtn:active{transform:translateY(2px);box-shadow:none}
.optrow{display:flex;flex-direction:column;gap:6px}.optrow label{font:800 13px var(--body)}
.vlist{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}.vblk{border:2px solid #E0D9C6;border-radius:12px;padding:8px 10px;background:#fff}.vblk.cur{border-color:var(--coral)}.vh{display:flex;align-items:center;gap:8px;margin-bottom:2px}.vh b{font:400 15px var(--display)}.vh span{font-size:10px;font-weight:800;background:var(--coral);color:#fff;border-radius:99px;padding:1px 8px}
.vnote{font-size:12px;line-height:1.6;padding-left:16px;margin:0}.vnote li+li{margin-top:2px}
#mpLog{position:fixed;left:6px;right:6px;top:6px;z-index:999;max-height:30vh;pointer-events:none;display:flex;flex-direction:column;background:rgba(0,0,0,.88);color:#9FF5C8;border:1px solid #5ED6B0;border-radius:10px;font:11px/1.4 ui-monospace,monospace}
#mpLog .mlh{pointer-events:auto;display:flex;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid #24505E}#mpLog .mlh b{flex:1;color:#fff}#mpLog button{font:11px var(--body);background:#24505E;color:#fff;border:0;border-radius:6px;padding:3px 8px}
#mpLog pre{margin:0;padding:6px 8px;overflow:auto;white-space:pre-wrap;word-break:break-all}#mpLog.min pre{display:none}
.xpline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;font-size:13px}.xpline b{font:400 15px var(--display)}.xpline .lvup{color:#E8456B;font:400 15px var(--display);animation:pop .4s both}.xpbar{flex-basis:100%;height:8px;border-radius:99px;background:#DDD6C4;overflow:hidden;max-width:220px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#FFC83D,#FF7A59)}.xpline small{color:#5E5A72}
.timer{height:6px;border-radius:3px;background:#071318;overflow:hidden;border:1px solid var(--line)}.timer i{display:block;height:100%;background:var(--gold)}
/* ---------- radar ops ---------- */
.top .hq{margin-left:auto}
.top .gear{font-size:26px;line-height:1}
.dock{grid-template-columns:repeat(2,1fr)}
.toast.btm{top:calc(50% - 46px)}
.cwrap{position:relative;min-width:0;min-height:0}
.cwrap canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;border-radius:12px}
.hero{display:flex;flex-direction:column;gap:6px;flex:none}
.title{margin:0;font:400 clamp(18px,5.4vw,24px)/1.1 var(--display);letter-spacing:0;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.top{gap:8px;position:relative}.top .namechip{max-width:calc(50% - 60px);padding:4px 10px}.top .namechip small{white-space:nowrap}
.top .title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;font-size:clamp(16px,4.8vw,22px)}
.scope{flex:1 1 auto;min-height:200px;background:none;border:0;padding:0;cursor:pointer;border-radius:14px}
.warn{color:var(--rose);font-weight:800}
.homebtns{display:flex;justify-content:center;flex:none}
#bFight{font-size:17px;padding:10px 20px;width:min(84%,320px)}
#vHome .chips,#vDeck .tray,#vDeck .dbtns{flex:none}
/* deck editor */
.dboard{width:100%;aspect-ratio:1;max-height:min(46dvh,420px);flex:none}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 4px;color:var(--paper);min-width:0}
.pc canvas{height:20px;max-width:100%}
.pc b{font:800 13px var(--body)}.pc small{font-size:10px;color:var(--muted);white-space:nowrap}
.pc.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,61,.35);background:#1B3E4A}
.pc.done{opacity:.6}.pc.done::after{content:'✓';position:absolute;top:2px;right:6px;font:800 13px var(--body);color:var(--mint)}
.dhd{display:flex;align-items:center;gap:8px;flex:none}.dhd h2{white-space:nowrap}.dhd .chip{white-space:nowrap}.dhd .btn{padding:7px 11px;font-size:14px;white-space:nowrap;flex:none}.dhd #bAuto{margin-left:auto}.dhd{gap:6px}.dhd h2{font-size:clamp(18px,5.4vw,22px)}.dhd .btn{padding:7px 16px;font-size:14px}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dbtns .btn{padding:9px 6px;font-size:14px}
/* battle */
#ovBattle{padding:0;align-items:stretch;background:var(--ink)}
.bt{display:flex;flex-direction:column;width:100%;height:100%;box-sizing:border-box;gap:6px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:14px 14px}
.bhd{display:flex;align-items:center;gap:8px;justify-content:space-between;flex:none}
.who{display:flex;flex-direction:column;min-width:0;flex:none;max-width:38%}
.who b{font:800 14px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font:400 12px var(--display);color:var(--muted)}.who small em{font-style:normal;color:var(--gold);font-size:15px}
.ofl{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.sk{display:flex;align-items:center;gap:6px;font:400 13px var(--display);color:var(--muted)}.sk b{font:400 15px var(--display);color:var(--muted)}.sk b em{font-style:normal;font-size:22px;color:var(--gold)}
.skp{display:flex;gap:4px}.skp i{width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);box-sizing:border-box}.skp i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,200,61,.6)}
.gurow{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px}.bgg{display:flex;align-items:center;gap:6px;flex:1 1 100%;min-width:0}
.bgg button{background:none;border:0;color:var(--gold);font:800 16px var(--body);padding:0 2px;cursor:pointer}.bgg.off button{color:var(--muted);text-decoration:line-through}
.bgg .vm{height:16px;flex:1;gap:2px}.bgg .vm i{background:#24505E}.bgg .vm i.on{background:var(--gold)}.bgg.off .vm i.on{background:#4A6670}
.mside .btn.gu{align-self:auto;flex:none}.btn.gu.arm{background:var(--rose);color:#fff;border-color:var(--rose);box-shadow:0 4px 0 #A3243B}
.fchip{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 5px;font:800 10px var(--body);color:var(--paper)}
.fchip canvas{height:12px}

.btn.fire:active{box-shadow:0 1px 0 #B68714}

<script>
(()=>{

/* ---------- utils ---------- */
function cyrb128(str){let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;for(let i=0,k;i<str.length;i++){k=str.charCodeAt(i);h1=h2^Math.imul(h1^k,597399067);h2=h3^Math.imul(h2^k,2869860233);h3=h4^Math.imul(h3^k,951274213);h4=h1^Math.imul(h4^k,2716044179)}

function btMsg(m,k){if(!m)return;document.querySelectorAll('.toast.btm').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast btm '+(k||'');t.textContent=m;$('#app').appendChild(t);setTimeout(()=>t.remove(),1700)}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------- pieces ---------- */
const PT=[{k:'mine',n:'地雷',len:1,hp:1},{k:'cessna',n:'セスナ',len:1,hp:1},{k:'jet',n:'ジェット',len:2,hp:2},{k:'ship',n:'船',len:3,hp:2},{k:'big',n:'大型船',len:4,hp:3},{k:'carrier',n:'空母',len:5,hp:4},{k:'sub',n:'潜水艦',len:3,hp:2}];
const COLS='ABCDEFGHIJ',lbl=(x,y)=>COLS[x]+'-'+(y+1);
const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
function cellsOf(p,t){const o=[];for(let k=0;k<PT[t].len;k++)o.push([p.x+(p.v?0:k),p.y+(p.v?k:0)]);return o}
function occOf(deck,skip=-1){const g=new Int8Array(N*N).fill(-1);(deck||[]).forEach((p,t)=>{if(!p||t===skip)return;for(const [x,y] of cellsOf(p,t))if(inB(x,y))g[y*N+x]=t});return g}
function fits(deck,t,p,skip){const occ=occOf(deck,skip);return cellsOf(p,t).every(([x,y])=>inB(x,y)&&occ[y*N+x]<0)}
const dirOf=p=>p.d!=null?(p.d|0)&3:(p.v?1:0);
const normDeck=d=>d.map(p=>{const dd=dirOf(p);return{x:p.x|0,y:p.y|0,v:dd&1,d:dd}});
function rndPlace(d,t,r=Math.random){const len=PT[t].len;for(let k=0;k<500;k++){const v=len>1&&r()<.5?1:0,p={x:Math.floor(r()*(v?N:N-len+1)),y:Math.floor(r()*(v?N-len+1:N)),v,d:len>1?(v?(r()<.5?1:3):(r()<.5?0:2)):Math.floor(r()*4)};if(fits(d,t,p,-1))return p}return null}
/* keep the valid pieces of a deck and put the missing/broken ones in free spots */
function fixDeck(src){const out=PT.map(()=>null);PT.forEach((_,t)=>{const p=src&&src[t];if(p&&fits(out,t,p,-1))out[t]=p});for(const t of [5,4,6,3,2,1,0])if(!out[t])out[t]=rndPlace(out,t);return deckOk(out)?out:randomDeck()}
function deckOk(d){if(!Array.isArray(d)||d.length!==PT.length)return false;const g=new Int8Array(N*N).fill(-1);
  for(let t=0;t<PT.length;t++){const p=d[t];if(!p||typeof p!=='object')return false;for(const [x,y] of cellsOf({x:p.x|0,y:p.y|0,v:p.v?1:0},t)){if(!inB(x,y)||g[y*N+x]>=0)return false;g[y*N+x]=t}}return true}
function randomDeck(r=Math.random){for(let tr=0;tr<300;tr++){const d=PT.map(()=>null);let ok=true;
  for(const t of [5,4,6,3,2,1,0]){let put=false;for(let k=0;k<300&&!put;k++){const len=PT[t].len,v=len>1&&r()<.5?1:0,p={x:Math.floor(r()*(v?N:N-len+1)),y:Math.floor(r()*(v?N-len+1:N)),v,d:len>1?(v?(r()<.5?1:3):(r()<.5?0:2)):Math.floor(r()*4)};if(fits(d,t,p,-1)){d[t]=p;put=true}}if(!put){ok=false;break}}
  if(ok)return d}return PT.map(()=>null)}
/* one side of a battle: deck (null if hidden), damage per piece, what the attacker has learned (marks: 0 ?, 1 miss, 2 hit) */
function mkSide(deck){return{deck,occ:deck?occOf(deck):null,dmg:PT.map(()=>0),sunk:PT.map(()=>false),hitG:new Uint8Array(N*N),marks:new Uint8Array(N*N),sunkList:[]}}
function rayCells(x,y){const o=[{x,y,d:0}];for(let i=0;i<N;i++){if(i!==x)o.push({x:i,y,d:Math.abs(i-x)});if(i!==y)o.push({x,y:i,d:Math.abs(i-y)})}return o}
/* durability is per cell: a cell of a piece with durability n breaks after n hits. All cells broken → sunk.
   hits = [x,y,broken(0/1)] */
function resolveShot(side,x,y){const hits=[],sunk=[];for(const c of rayCells(x,y)){const i=c.y*N+c.x,p=side.occ[i];if(p>=0&&side.hitG[i]<PT[p].hp){const k=Math.min(c.d===0?2:1,PT[p].hp-side.hitG[i]);side.hitG[i]+=k;side.dmg[p]+=k;hits.push([c.x,c.y,side.hitG[i]>=PT[p].hp?1:0])}}
  PT.forEach((pt,t)=>{if(side.sunk[t])return;const p=side.deck[t];if(cellsOf(p,t).every(([a,b])=>side.hitG[b*N+a]>=pt.hp)){side.sunk[t]=true;sunk.push({t,x:p.x,y:p.y,v:p.v?1:0})}});return{hits,sunk}}
function knowOf(side){const k=Uint8Array.from(side.marks);for(const s of side.sunkList)for(const [x,y] of cellsOf(s,s.t))if(inB(x,y))k[y*N+x]=3;return k}
function newCells(side,x,y){const k=knowOf(side);return rayCells(x,y).filter(c=>k[c.y*N+c.x]===0).length}
/* targeting AI: count every placement of the pieces still afloat that fits what is known (placements over known hits weigh much more),
   then score a shot by the weight on the unexplored cells of its row + column */
function aiScores(side){const k=knowOf(side),rem=PT.map((_,t)=>t).filter(t=>!side.sunkList.some(s=>s.t===t)),den=new Float32Array(N*N);
  for(const t of rem){const len=PT[t].len;for(const v of len>1?[0,1]:[0])for(let y=0;y<N;y++)for(let x=0;x<N;x++){let ok=true,h=0;const cs=cellsOf({x,y,v},t);
    for(const [a,b] of cs){if(!inB(a,b)){ok=false;break}const s=k[b*N+a];if(s===1||s===3){ok=false;break}if(s===2||s===4)h++}
    if(!ok)continue;const w=h?1+h*30:1;for(const [a,b] of cs)if(k[b*N+a]===0||k[b*N+a]===2)den[b*N+a]+=w}}
  const val=j=>k[j]===0?den[j]:k[j]===2?den[j]+60:0;const out=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let s=0;for(let i=0;i<N;i++){s+=val(y*N+i);if(i!==y)s+=val(i*N+x)}s+=k[y*N+x]===2?den[y*N+x]+60:0;out.push({x,y,s:s+Math.random()*.01})}

/* ---------- save ---------- */
function defSave(){return{name:'',plv:1,pxp:0,lstreak:0,rec:{w:0,l:0},opt:{sound:true,bgm:true,online:true},deck:null,ver:VER}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return Object.assign(defSave(),s)}catch(e){}return defSave()}
let save=load();if(!Array.isArray(save.deck))save.deck=randomDeck();else if(save.deck.length!==PT.length){save.deck=fixDeck(PT.map((_,t)=>save.deck[t]||null))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
persist();
/* ---------- sound ---------- */
let AC=null;
function tone(f,d,type='square',v=.06,slide=0,delay=0){if(!save.opt.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);const vv=v*volOf('vol')/7;if(vv<=0)return;g.gain.setValueAtTime(vv,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,f=900,delay=0){if(!save.opt.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const vv=v*volOf('vol')/7;if(vv<=0)return;const t=AC.currentTime+delay,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=f;s.buffer=b;g.gain.value=vv;s.connect(lp).connect(g).connect(AC.destination);s.start(t)}catch(e){}}
/* battle BGM: original minor-key march loop (8 bars) */
const BGM={on:false,t:0,i:0,iv:0,g:null};
const NF=n=>{const m=/^([A-G])(#?)(\d)$/.exec(n);const k={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0)+(+m[3]+1)*12;return 440*Math.pow(2,(k-69)/12)};
const BGM_MEL=[['D5',2],['A4',1],['D5',1],['F5',2],['E5',1],['D5',1], ['C5',2],['A4',2],['G4',2],['A4',2],

function bgmNote(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(BGM.g);o.start(t);o.stop(t+d+.02)}

function bgmTick(){if(!BGM.on||!AC)return;const ahead=AC.currentTime+.35;while(BGM.t<ahead){const step=BGM.i%64,t=BGM.t;
    for(const e of BGM_EV)if(e.p===step)bgmNote(NF(e.n),t,e.l*BGM_STEP*.9,'square',.03);

function bgmPreview(){if(!save.opt.sound)return;if(!BGM.on){bgmStart(true);BGM.pv=true}clearTimeout(BGM.pvT);BGM.pvT=setTimeout(bgmPreviewEnd,2500)}
function bgmPreviewEnd(){clearTimeout(BGM.pvT);if(BGM.pv){BGM.pv=false;if(!inBattle())bgmStop()}}

const SFX={tap:()=>tone(660,.05,'triangle',.05),tick:()=>tone(1320,.025,'square',.018),place:()=>{tone(440,.05,'square',.04);tone(660,.07,'square',.04,0,.05)},err:()=>tone(160,.12,'square',.04),

/* ---------- drawing ---------- */
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function drawPiece(c,t,cx,cy,cs,v,st){const len=PT[t].len,L=len*cs,W=cs,k=PT[t].k;c.save();c.translate(cx,cy);c.rotate([0,-Math.PI/2,Math.PI,Math.PI/2][v&3]);

    <div class="ctl"><div class="turn" id="turnLbl"></div><div class="aim" id="aimLbl"></div><button class="btn ghost gu" id="bGiveup">こうさん</button><button class="btn fire" id="bFire" disabled>発射</button></div>
    <div class="timer"><i id="tbar" style="width:0"></i></div>
    <div class="mrow"><div class="cwrap mbwrap"><canvas id="mCv" aria-label="自分のエリア"></canvas></div><div class="mside"><div class="who" style="max-width:100%"><b>${esc(save.name)}</b><small>のこり <em id="meLeft">6</em>体</small></div><div class="mfl" id="meFleet"></div><div class="gurow"><div class="bgg" id="bgG"></div></div></div></div>`;
  $('#bGiveup').onclick=()=>{if(!G||G.over)return;const gb=$('#bGiveup');if(Date.now()-(G.gu||0)<2500){G.giveup=true;G.cancelR()}else{G.gu=Date.now();SFX.err();gb.classList.add('arm');setTimeout(()=>{if(gb.isConnected)gb.classList.remove('arm')},2500)}};
  renderBgG();
  $('#bFire').onclick=()=>{if(G&&G.fire)G.fire()};
  const cv=$('#eCv');let down=null;
  const setCur=cl=>{const cu=G.eB.cur;if(cl.x===cu.x&&cl.y===cu.y)return;cu.x=cl.x;cu.y=cl.y;SFX.tick();updAim()};
  cv.addEventListener('pointerdown',e=>{if(!G||!G.aiming)return;const cl=cellAt(cv,G.eB,e);if(!cl)return;cv.setPointerCapture(e.pointerId);const cu=G.eB.cur;down={same:cl.x===cu.x&&cl.y===cu.y,moved:false};setCur(cl)});
  cv.addEventListener('pointermove',e=>{if(!down||!G||!G.aiming)return;const cl=cellAt(cv,G.eB,e);if(!cl)return;const cu=G.eB.cur;if(cl.x!==cu.x||cl.y!==cu.y){down.moved=true;setCur(cl)}});
  cv.addEventListener('pointerup',()=>{const d=down;down=null;if(d&&d.same&&!d.moved&&G&&G.fire)G.fire()});
  cv.addEventListener('pointercancel',()=>{down=null});
  updFleet()}
document.addEventListener('keydown',e=>{if(!G||!G.aiming||$('#ovBattle').hidden)return;const cu=G.eB.cur,m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){e.preventDefault();cu.x=clamp(cu.x+m[0],0,N-1);cu.y=clamp(cu.y+m[1],0,N-1);SFX.tick();updAim()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(G.fire)G.fire()}});
function updAim(){if(!G)return;const cu=G.eB.cur;$('#aimLbl').innerHTML=`<b>${lbl(cu.x,cu.y)}</b> をねらう・まだ調べていない ${newCells(G.en,cu.x,cu.y)}マス`}
/* BGM gauge in battle: ♪ toggles BGM, bars set its volume */
function renderBgG(){const el=$('#bgG');if(!el)return;const on=save.opt.bgm!==false&&save.opt.sound,v=volOf('bvol');el.className='bgg'+(on?'':' off');
  el.innerHTML=`<button type="button" id="bgOn" aria-label="BGM ${on?'オフにする':'オンにする'}">♪</button><span class="vm">${[...Array(10)].map((_,i)=>`<i class="${i<v?'on':''}" data-i="${i}"></i>`).join('')}</span>`;
  $('#bgOn').onclick=()=>{if(on){save.opt.bgm=false;bgmStop()}else{save.opt.bgm=true;save.opt.sound=true;if(!volOf('bvol'))save.opt.bvol=5;bgmStart()}persist();renderBgG()};
  el.querySelectorAll('.vm i').forEach(x=>x.onclick=()=>{save.opt.bvol=+x.dataset.i+1;save.opt.bgm=true;save.opt.sound=true;persist();if(BGM.on)bgmVol();else bgmStart();renderBgG()})}
function updFleet(){const g=G;if(!g)return;const ns=g.en.sunkList.length;$('#opSunk').textContent=ns;$('#skp').innerHTML=[...Array(WIN_SINK)].map((_,i)=>`<i class="${i<ns?'on':''}"></i>`).join('');
  const mf=$('#meFleet');mf.innerHTML='';PT.forEach((p,t)=>{const r=document.createElement('div'),sunk=g.me.sunk[t],left=cellsOf(g.me.deck[t],t).filter(([a,b])=>g.me.hitG[b*N+a]<p.hp).length;r.className='mf'+(sunk?' sunk':'');r.appendChild(iconCv(t,9));
    r.insertAdjacentHTML('beforeend',`<span>${p.n}</span><span class="pips" aria-label="のこり${left}マス">${[...Array(p.len)].map((_,i)=>`<i class="${i<left?'':'x'}"></i>`).join('')}</span>`);mf.appendChild(r)});
  $('#meLeft').textContent=g.me.sunk.filter(x=>!x).length}
function setTurn(g,mine,txt){const t=$('#turnLbl');t.className='turn '+(mine?'me':'op');t.textContent=txt||(mine?'あなたのばん':'あいてのばん…');if(!mine)$('#aimLbl').textContent='相手がねらっています…'}
function timerRun(ms,onEnd){const t0=performance.now(),bar=$('#tbar');let done=false;const iv=setInterval(()=>{if(!bar.isConnected){stop();return}const k=Math.min(1,(performance.now()-t0)/ms);bar.style.width=(100-k*100)+'%';if(k>=1){stop();onEnd()}},50);const stop=()=>{if(done)return;done=true;clearInterval(iv);bar.style.width='0'};return stop}
const rc=(g,p)=>Promise.race([p,g.cancelP.then(()=>null)]);
function aimWait(g,ms){return new Promise(res=>{let done=false,stop=()=>{};const fin=v=>{if(done)return;done=true;stop();g.aiming=false;g.fire=null;const bf=$('#bFire');if(bf)bf.disabled=true;res(v)};
  g.aiming=true;g.eB.cur.on=true;$('#bFire').disabled=false;updAim();if(!SMALL())$('#eCv').focus({preventScroll:true});
  g.fire=()=>{const cu=g.eB.cur;fin({x:cu.x,y:cu.y})};g.cancelP.then(()=>fin(null));
  stop=timerRun(ms,()=>{const b=aiScores(g.en)[0],cu=g.eB.cur;if(b){cu.x=b.x;cu.y=b.y;updAim()}toast('時間切れ！ おまかせで発射');setTimeout(()=>fin({x:cu.x,y:cu.y}),500)})})}
const SMALL=()=>window.matchMedia('(pointer:coarse)').matches;
function cleanRes(m,side,x,y){const on=new Set(rayCells(x,y).map(c=>c.y*N+c.x)),seen=new Set(),hits=[];
  for(const h of Array.isArray(m.h)?m.h:[]){if(!Array.isArray(h))continue;const a=h[0]|0,b=h[1]|0,i=b*N+a;if(inB(a,b)&&on.has(i)&&!seen.has(i)&&side.marks[i]!==4&&side.marks[i]!==1){seen.add(i);hits.push([a,b,h[2]?1:0])}}
  const sunk=[];for(const s of Array.isArray(m.s)?m.s:[]){if(!s)continue;const t=s.t|0;if(t<0||t>=PT.length||side.sunkList.some(q=>q.t===t)||sunk.some(q=>q.t===t))continue;const p={t,x:s.x|0,y:s.y|0,v:s.v?1:0};if(cellsOf(p,t).every(([a,b])=>inB(a,b)))sunk.push(p)}
  return{hits,sunk}}
async function runGame(g){
  btMsg2(g.first===g.my?'先攻！':'後攻',g.first===g.my?'先にソーラーレイをうてる':'まずは相手の攻撃から','');await rc(g,sleep(1300));
  while(!g.over&&!g.giveup&&!g.opOut){g.turn++;const att=(g.first+g.turn-1)%2;
    const ok=att===g.my?await myTurn(g):await theirTurn(g);if(g!==G)return;if(!ok)break;
    if(g.en.sunkList.length>=WIN_SINK){g.result='w';break}if(g.me.sunkList.length>=WIN_SINK){g.result='l';break}}
  if(g!==G)return;
  if(g.giveup){g.result='l';g.reason='gu';if(g.net)netSend({ty:'gu'})}else if(g.opOut){g.result='w';g.reason=g.opOut}else g.reason=g.result==='w'?'win':'lose';
  await finish(g)}
async function myTurn(g){setTurn(g,true);g.mB.cur.on=false;const pk=await aimWait(g,TURN_MS);if(!pk||g.giveup)return false;const {x,y}=pk,B=g.eB;
  B.cur.x=x;B.cur.y=y;g.stats.shots++;B.charge={x,y,t0:performance.now()};SFX.charge();setTurn(g,true,'ソーラーレイ照射！');$('#aimLbl').innerHTML=`<b>${lbl(x,y)}</b> にうった`;
  let res;
  if(g.net){netSend({ty:'sh',n:g.turn,x,y});const m=await rc(g,waitFor(o=>o.ty==='rs'&&o.n===g.turn,20000));if(g.giveup){B.charge=null;return false}
    if(!m||m.ty==='gu'){B.charge=null;g.opOut=m?'gu':'left';return false}res=cleanRes(m,g.en,x,y);g.log.push({x,y,h:res.hits,s:res.sunk.map(s=>s.t)})}
  else res=resolveShot(g.en,x,y);
  await sleep(Math.max(0,650-(performance.now()-B.charge.t0)));g.stats.hits+=res.hits.length;
  await shotAnim(g,B,g.en,x,y,res,true);return true}
async function theirTurn(g){setTurn(g,false);g.eB.cur.on=false;const B=g.mB;B.cur.on=true;let wand=true;
  (async()=>{while(wand&&g===G){B.cur.x=Math.floor(Math.random()*N);B.cur.y=Math.floor(Math.random()*N);await sleep(420+Math.random()*480)}})();
  let x,y;
  if(g.net){const m=await rc(g,waitFor(o=>o.ty==='sh'&&o.n===g.turn,TURN_MS+20000));wand=false;if(g.giveup)return false;if(!m||m.ty==='gu'){g.opOut=m?'gu':'left';return false}x=clamp(m.x|0,0,N-1);y=clamp(m.y|0,0,N-1)}
  else{await rc(g,sleep(1200+Math.random()*1500));wand=false;if(g.giveup)return false;({x,y}=cpuPick(g))}
  const res=resolveShot(g.me,x,y);if(g.net)netSend({ty:'rs',n:g.turn,h:res.hits,s:res.sunk});
  B.cur.x=x;B.cur.y=y;SFX.tick();$('#aimLbl').innerHTML=`<b>${lbl(x,y)}</b> をねらわれた！`;await sleep(550);
  B.charge={x,y,t0:performance.now()};SFX.charge();await sleep(650);
  await shotAnim(g,B,g.me,x,y,res,false);return true}
async function shotAnim(g,B,side,x,y,res,atk){B.charge=null;B.sweep={x,y,t0:performance.now(),sp:SW};SFX.beam();
  const hs=new Map(res.hits.map(h=>[h[1]*N+h[0],h[2]?4:2])),byD=[];for(const c of rayCells(x,y))(byD[c.d]=byD[c.d]||[]).push(c);
  for(let d=0;d<byD.length;d++){let boom=false;if(d===0){B.boom={x,y,t0:performance.now()};burst(B,x,y,['#FFC83D','#FF7A59','#FFF4C2']);burst(B,x,y,['#FFC83D','#FF7A59','#FFF4C2']);SFX.boom();B.shake=Math.max(B.shake||0,10)}for(const c of byD[d]||[]){const i=c.y*N+c.x;if(hs.has(i)){side.marks[i]=hs.get(i);boom=true;burst(B,c.x,c.y)}else if(side.marks[i]===0)side.marks[i]=1}
    if(boom&&d>0){SFX.boom();B.shake=Math.max(B.shake||0,7)}await sleep(d===0?SW*3:SW)}
  await sleep(260);B.sweep=null;
  for(const s of res.sunk){if(!side.sunkList.some(q=>q.t===s.t))side.sunkList.push(s);side.sunk[s.t]=true;for(const [a,b] of cellsOf(s,s.t))if(inB(a,b))burst(B,a,b,['#8FB2BC','#F4F1E8','#FF5C7A'])}
  const n=res.hits.length,names=res.sunk.map(s=>PT[s.t].n).join('と'),at=lbl(x,y);
  if(res.sunk.length){SFX.sink();B.shake=12}
  if(atk){const left=Math.max(0,WIN_SINK-side.sunkList.length);
    if(res.sunk.length)btMsg2(res.sunk.length>1?`撃沈 ×${res.sunk.length}！`:'撃沈！',left?`あと${left}体で勝利`:'これで5体目！','w');else if(n)btMsg2(`HIT ×${n}`,`${at} のソーラーレイが命中`,'w');else btMsg2('MISS',`${at} はハズレ`,'d')}
  else{if(res.sunk.length)btMsg2('やられた…',`${names}が撃沈された`,'l');else if(n)btMsg2(`被弾 ×${n}`,`${at} をうたれた`,'l');else btMsg2('セーフ！',`${at} はハズレ`,'w')}
  updFleet();await sleep(n||res.sunk.length?1250:950)}
function verifyReveal(g,m){const d=m&&m.d;if(!deckOk(d)||typeof m.s!=='string')return null;const nd=normDeck(d);if(hex(cyrb128(JSON.stringify(nd)+'|'+m.s))!==g.opCm)return null;
  const sd=mkSide(nd),key=a=>a.map(h=>h[0]+','+h[1]+','+(h[2]?1:0)).sort().join(';');for(const l of g.log){const r=resolveShot(sd,l.x,l.y);if(key(r.hits)!==key(l.h)||r.sunk.map(s=>s.t).sort().join()!==l.s.slice().sort().join())return null}return nd}
async function finish(g){g.over=true;g.aiming=false;g.fire=null;const bf=$('#bFire');if(bf)bf.disabled=true;g.eB.cur.on=false;g.mB.cur.on=false;
  if(g.net&&!g.opOut&&!g.giveup){netSend({ty:'rv',d:g.me.deck,s:g.salt});const m=await waitFor(o=>o.ty==='rv',6000);
    if(m&&m.ty==='rv'){const nd=verifyReveal(g,m);if(!nd){g.result='w';g.reason='cheat'}else{g.en.deck=nd;g.eB.reveal=true}}}
  if(!g.net){g.eB.reveal=true}
  if(g.net)netClose();
  setTurn(g,g.result==='w',g.result==='w'?'作戦成功！':'作戦失敗…');$('#aimLbl').textContent=g.eB.reveal?'相手の配置をみてみよう':'';
  if(g.result==='l'&&g.reason==='lose')btMsg2('まけ…','部隊が5体しずめられた','l');else if(g.result==='w'&&g.reason==='win')btMsg2('かち！','相手の部隊を5体しずめた','w');
  bgmStop();(g.result==='w'?SFX.win:SFX.lose)();await sleep(g.reason==='gu'?300:2300);if(g!==G)return;
  const r=g.result;save.rec[r]=(save.rec[r]||0)+1;save.lstreak=r==='l'?(save.lstreak||0)+1:0;const xp=r==='w'?30:12;save.pxp=(save.pxp||0)+xp;save.plv=save.plv||1;let lvUp=false;
  while(save.pxp>=needXP(save.plv)&&save.plv<99){save.pxp-=needXP(save.plv);save.plv++;lvUp=true}persist();updLv();
  const op=esc(g.opName),why={win:`${op}の部隊を5体しずめた！`,lose:`${op}に5体しずめられた`,gu:r==='w'?`${op}がこうさんした`:'こうさんした',left:`${op}との通信が切れた（勝ち）`,cheat:`${op}の配置が正しくなかった（勝ち）`}[g.reason]||'';
  const rate=g.stats.shots?Math.round(g.stats.hits/g.stats.shots*10)/10:0;
  const el=$('#resSheet');el.innerHTML=`<h3 style="color:${r==='w'?'#1F8F5A':'#C0304A'};text-align:center">${r==='w'?'YOU WIN!':'YOU LOSE…'}</h3><p class="sub" style="text-align:center;margin:0">${why}</p>
    <div class="stats"><span>発射 ${g.stats.shots}回</span><span>命中 ${g.stats.hits}マス</span><span>1発あたり ${rate}マス</span><span>撃沈 ${g.en.sunkList.length}体</span></div>
    <div class="xpline"><b>プレイヤー Lv${save.plv}</b>${lvUp?'<span class="lvup">LEVEL UP!</span>':''}<span class="xpbar"><i style="width:${Math.round(save.pxp/needXP(save.plv)*100)}%"></i></span><small>+${xp} EXP</small></div>
    <button class="btn ghost" id="bBoard">盤面を見る<small>この対戦の結果</small></button><button class="btn ghost" id="bResX">とじる</button>`;
  $('#ovRes').hidden=false;$('#bResX').onclick=()=>{$('#ovRes').hidden=true;closeBT()};
  /* look back at both boards; the fire button turns into a way back to the result */
  $('#bBoard').onclick=()=>{SFX.tap();$('#ovRes').hidden=true;const gu=$('#bGiveup'),bf=$('#bFire');if(gu)gu.hidden=true;$('#timer')&&($('#timer').hidden=true);
    if(bf){bf.textContent='結果へ';bf.disabled=false;bf.classList.add('back')}g.fire=()=>{SFX.tap();$('#ovRes').hidden=false};
    $('#aimLbl').textContent=g.eB.reveal?'上：相手　下：あなたの配置':'上：当てたマス　下：うたれたマス'}}
function closeBT(){bgmStop();if(G){if(G.net)netClose();G.cancelR();G.over=true}G=null;$('#ovBattle').hidden=true;renderHome()}
/* opponent's 'gu' arriving while it is my turn to aim */
setInterval(()=>{if(G&&G.net&&G.aiming&&(NET.left||NET.inbox.some(m=>m.ty==='gu'))){G.opOut=NET.left?'left':'gu';G.cancelR()}},500);
/* ---------- options ---------- */
function volRow(k,lb){const v=volOf(k);return `<div class="volr" data-k="${k}"><small>${lb}</small><button type="button" class="vdn" aria-label="${lb}を下げる">－</button><span class="vm">${[...Array(10)].map((_,i)=>`<i class="${i<v?'on':''}"></i>`).join('')}</span><button type="button" class="vup" aria-label="${lb}を上げる">＋</button><b class="vn">${v?v:'消音'}</b></div>`}
function openOpt(){const el=$('#optSheet');
  el.innerHTML=`<div class="opthd"><h3>オプション</h3><button type="button" class="xbtn" id="bOptX" aria-label="とじる">✕</button></div><div class="optrow"><label>音</label><div class="seg" id="segS"><button data-v="1" class="${save.opt.sound?'on':''}">ON</button><button data-v="0" class="${save.opt.sound?'':'on'}">OFF</button></div>${volRow('vol','効果音の音量')}</div>
  <div class="optrow"><label>バトルBGM</label><div class="seg" id="segB"><button data-v="1" class="${save.opt.bgm!==false?'on':''}">ON</button><button data-v="0" class="${save.opt.bgm===false?'on':''}">OFF</button></div>${volRow('bvol','BGMの音量')}</div>
  <div class="optrow"><label>オンライン対戦</label><div class="seg" id="segN"><button data-v="1" class="${save.opt.online!==false?'on':''}">ON</button><button data-v="0" class="${save.opt.online===false?'on':''}">オフライン</button></div></div>
  <div class="optrow"><label>バージョン情報</label><div class="vlist"><div class="vblk cur"><div class="vh"><b>Ver${VER}</b><span>いまのバージョン</span></div><ul class="vnote"><li>はじめてのバージョン</li><li>10×10マスのレーダー作戦：上が相手のエリア、下が自分のエリア</li><li>ソーラーレイ：えらんだマスから、たて1列とよこ1列ぜんぶに当たる。十字のねらいがマスからマスへ動く</li><li>デッキ編成：地雷・セスナ・ジェット・船・大型船・空母の6体をならべる（おまかせもあり）</li><li>先に5体撃沈したら勝ち</li><li>オンライン対戦（見つからなければCPU）。配置はさいごに答え合わせして、ずるができないようにした</li><li>プレイヤーレベル：Lvが低いうちはCPUがやさしめ、負けが続くとさらにやさしく</li></ul></div></div></div>`;
  el.querySelectorAll('#segS button').forEach(b=>b.onclick=()=>{save.opt.sound=b.dataset.v==='1';if(!save.opt.sound)bgmStop();persist();SFX.tap();openOpt()});
  el.querySelectorAll('.volr').forEach(r=>{const k=r.dataset.k,upd=()=>{const v=volOf(k);r.querySelectorAll('.vm i').forEach((x,i)=>x.classList.toggle('on',i<v));r.querySelector('.vn').textContent=v?v:'消音';bgmVol();if(k==='bvol')bgmPreview()};
    r.querySelector('.vdn').onclick=()=>{save.opt[k]=Math.max(0,volOf(k)-1);persist();upd();if(k==='vol')SFX.tap()};r.querySelector('.vup').onclick=()=>{save.opt[k]=Math.min(10,volOf(k)+1);persist();upd();if(k==='vol')SFX.tap()};
    r.querySelectorAll('.vm i').forEach((x,i)=>x.onclick=()=>{save.opt[k]=i+1;persist();upd();if(k==='vol')SFX.tap()})});
  el.querySelectorAll('#segB button').forEach(b=>b.onclick=()=>{save.opt.bgm=b.dataset.v==='1';persist();SFX.tap();openOpt()});
  el.querySelectorAll('#segN button').forEach(b=>b.onclick=()=>{save.opt.online=b.dataset.v==='1';persist();SFX.tap();openOpt();renderHome()});
  $('#bOptX').onclick=()=>{$('#ovOpt').hidden=true;bgmPreviewEnd()};$('#ovOpt').hidden=false}
$('#bOpt').onclick=()=>{SFX.tap();openOpt()};
$('#ovOpt').addEventListener('click',e=>{if(e.target.id==='ovOpt'){$('#ovOpt').hidden=true;bgmPreviewEnd()}});
/* ---------- main loop ---------- */
function frame(now){requestAnimationFrame(frame);if(document.hidden)return;
  if(G&&!$('#ovBattle').hidden){drawBoard($('#eCv'),G.eB,now);drawBoard($('#mCv'),G.mB,now);return}
  if(curView==='vHome'){if(now>HB.nt){HB.nt=now+1500+Math.random()*900;HB.cur.x=Math.floor(Math.random()*N);HB.cur.y=Math.floor(Math.random()*N)}if(HB.side)drawBoard($('#hCv'),HB,now)}
  else if(curView==='vDeck'&&ED.B.side)drawBoard($('#dCv'),ED.B,now)}
if(/[?&]dbg=1/.test(location.search))window.__ro={get save(){return save},get G(){return G},NET,aiScores,randomDeck,resolveShot};
/* boot */
updLv();drawIcons();renderHome();
if(!save.name)openName(true);
mpLog('[boot] Ver'+VER,'オンライン設定:',save.opt.online!==false?'ON':'OFF（オフライン）','サーバー:',MP_URL);
requestAnimationFrame(frame);
})();
</script>
